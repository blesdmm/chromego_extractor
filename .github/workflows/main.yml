name: Auto Extract

on:
    push:
        branches:
            - main
    schedule:
        - cron: "0 0,12 * * *"
    workflow_dispatch:

jobs:
    Extract:
        runs-on: ubuntu-latest

        # 1. 显式赋予仓库读写权限，解决推送报错
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            
            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run extract script
              run: python main.py

            - name: Write time into README file
              run: |
                echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
                sed -Ei "s|最近提取于：\`UTC [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\`|最近提取于：\`UTC $(date '+%Y-%m-%d %H:%M:%S')\`|g" README.md
                sed -Ei "s|recently extracted at: \`UTC [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\`|recently extracted at: \`UTC $(date '+%Y-%m-%d %H:%M:%S')\`|g" README.md
              
            - name: Commit & Push changes
              uses: stefanzweifel/git-auto-commit-action@v5  # 升级到 v5 版本
              with:
                    commit_message: "Auto extract by Github Actions"
                    branch: main
                    commit_options: '--allow-empty'
